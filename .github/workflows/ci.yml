name: PromisePay CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Lint, Test, and Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/api/requirements.txt
          pip install -r services/worker/requirements.txt
          pip install ruff mypy pytest-asyncio

      - name: Secret scanning
        run: |
          python infra/scripts/scan_secrets.py

      - name: Database migration check
        run: |
          python infra/scripts/check_migrations.py

      - name: Python linting & formatting check
        run: |
          ruff check services infra
          ruff format --check services infra

      - name: Run API & Worker unit tests
        run: |
          pytest services/api
          pytest services/worker
