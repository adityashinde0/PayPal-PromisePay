services:
  postgres:
    image: postgres:16-alpine
    container_name: promisepay-postgres
    environment:
      POSTGRES_DB: promisepay
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./supabase/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../services/api
      dockerfile: Dockerfile
    container_name: promisepay-api
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=development
      - PORT=8000
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../services/api:/app

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
    container_name: promisepay-web
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - api
    volumes:
      - ../apps/web:/app
      - /app/node_modules
      - /app/.next

volumes:
  postgres_data:

